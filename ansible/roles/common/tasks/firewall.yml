---

- name: Allow SSH through firewall
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Allow HTTP through firewall
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS through firewall
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Enable ufw
  community.general.ufw:
    state: enabled 

...