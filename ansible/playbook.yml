---
- name: Build and configure DigitalOcean Droplet
  hosts: localhost
  become: no

  vars:
    digitalocean_token: "{{ lookup('ansible.builtin.env', 'DIGITALOCEAN_TOKEN') }}"
    public_key: "{{ lookup('ansible.builtin.file', ansible_env['HOME'] ~ '/.ssh/id_ed25519.pub') }}"

  tasks:
    - name: Create SSH Key to Droplet
      digitalocean.cloud.ssh_key:
        state: present
        token: "{{ digitalocean_token }}"
        public_key: "{{ public_key }}"
        name: "{{ ansible_env['USER'] }}-key"
      register: ssh_key
